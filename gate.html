<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06130d">
<title>Hamstore Admin - Gate</title>
<link rel="icon" href="https://i.imgur.com/UXH5q5w.png">
<link rel="stylesheet" href="allui.css">
</head>
<body>
<main class="stage">
  <section class="panel box center" id="codeBox">
    <img class="logo xl" src="https://i.imgur.com/UXH5q5w.png" alt="Hamstore">
    <h2>Enter access code</h2>
    <p class="sub">Type the 6-digit code to continue.</p>
    <div class="code" id="code">
      <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 1">
      <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 2">
      <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 3">
      <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 4">
      <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 5">
      <input inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 6">
    </div>
  </section>

  <section class="panel box" id="loginBox" hidden>
    <div class="head">
      <img class="logo xl" src="https://i.imgur.com/UXH5q5w.png" alt="Hamstore">
      <p>Log in to manage Hamstore</p>
    </div>
    <form id="loginForm" novalidate>
      <div class="field"><i class="fa-solid fa-envelope lead"></i><input id="email" type="email" placeholder="Email" autocomplete="email"></div>
      <div class="field"><i class="fa-solid fa-lock lead"></i><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button type="button" class="eye" data-eye="password" aria-label="Show password"><i class="fa-solid fa-eye"></i></button></div>
      <button class="btn full" type="submit"><i class="fa-solid fa-right-to-bracket"></i>Log in</button>
      <button class="ghost sm" type="button" id="forgot" style="width:100%;margin-top:10px">Forgot password?</button>
    </form>
    <p class="foot">No account yet? <a href="register.html">Create one</a></p>
  </section>
</main>

<script type="module" src="allui.js"></script>
<script type="module" src="gate.js"></script>
</body>
</html>
