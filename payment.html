<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06130d">
<title>Hamstore Admin - Payments</title>
<link rel="icon" href="https://i.imgur.com/UXH5q5w.png">
<link rel="stylesheet" href="allui.css">
<link rel="stylesheet" href="ui2.css">
</head>
<body>
<main class="wrap">
  <div class="topline">
    <h2>Payments</h2>
    <button class="ghost" id="accounts" type="button"><i class="fa-solid fa-building-columns"></i>Account numbers</button>
  </div>
  <div class="stats" style="grid-template-columns:repeat(2,1fr)">
    <div class="stat"><b id="sPend">0</b><small id="sPendT">Waiting: ₦0</small></div>
    <div class="stat"><b id="sDone">0</b><small id="sDoneT">Completed: ₦0</small></div>
  </div>
  <div class="chips" id="tabs" style="margin:0">
    <button class="chip on" data-t="pending">Waiting</button>
    <button class="chip" data-t="done">Completed</button>
    <button class="chip" data-t="all">All</button>
  </div>
  <div class="rg" id="list" style="grid-template-columns:1fr"></div>
  <div class="empty" id="empty" hidden><i class="fa-solid fa-money-check-dollar" style="font-size:28px"></i><p>Nothing here yet.</p></div>
</main>

<script type="module" src="allui.js"></script>
<script type="module" src="adminpay.js"></script>
</body>
</html>
