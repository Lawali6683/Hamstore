<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06130d">
<title>Hamstore Admin - Posts</title>
<link rel="icon" href="https://i.imgur.com/UXH5q5w.png">
<link rel="stylesheet" href="allui.css">
</head>
<body>
<main class="wrap split">
  <section class="panel formcard">
    <h2 id="formTitle">New post</h2>
    <p class="sub" id="formSub">This will show on the Hamstore website.</p>
    <form id="form" novalidate>
      <div class="field"><i class="fa-solid fa-tag lead"></i><input id="fName" type="text" maxlength="80" placeholder="Product name"></div>
      <div class="field"><i class="fa-solid fa-naira-sign lead"></i><input id="fPrice" type="number" inputmode="decimal" min="0" placeholder="Price"></div>

      <span class="lab">Sold as</span>
      <div class="seg" id="segUnit"><button type="button" class="on" data-v="Carton">Carton</button><button type="button" data-v="Single">Single</button></div>

      <span class="lab">Type</span>
      <div class="seg alt" id="segCat"><button type="button" class="on" data-v="Drinks">Drinks</button><button type="button" data-v="Water">Water</button></div>

      <div id="imgField"></div>

      <div class="acts">
        <button class="btn full" type="submit" id="submitBtn"><i class="fa-solid fa-paper-plane"></i><span>Publish post</span></button>
        <button class="ghost" type="button" id="cancelEdit" hidden>Cancel editing</button>
      </div>
    </form>
  </section>

  <section>
    <div class="listhead"><h2>All posts</h2><span class="count" id="count">0</span></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden><i class="fa-regular fa-image" style="font-size:28px"></i><p>No posts yet. Create your first one.</p></div>
    <button class="btn more" id="more" type="button" hidden><i class="fa-solid fa-angles-down"></i>Load more</button>
  </section>
</main>

<script type="module" src="allui.js"></script>
<script type="module" src="adminpost.js"></script>
</body>
</html>
